name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Buduj stronę tylko, gdy zmiany trafią na main
  workflow_dispatch:      # Pozwala odpalić budowanie ręcznie przyciskiem
  schedule:
    - cron: '5 0 * * *'  # Uruchomi się codziennie o 00:05 UTC

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Tu Astro wrzuca gotową stronę

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4